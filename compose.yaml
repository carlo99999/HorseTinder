services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: horsetinder
      POSTGRES_USER: horsetinder
      POSTGRES_PASSWORD: horsetinder
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horsetinder -d horsetinder"]
  api:
    build: .
    command: litestar --app app.main:create_app run --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://horsetinder:horsetinder@postgres:5432/horsetinder
      APP_SECRET: local-development-secret
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    image: node:20-alpine
    working_dir: /workspace/apps/web
    volumes: [".:/workspace"]
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
