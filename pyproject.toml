[project]
name = "horsetinder"
version = "0.1.0"
description = "Horse Tinder's full-stack foundation"
readme = "README.md"
requires-python = ">=3.13.11"
dependencies = [
    "litestar==2.24.*",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pyrefly>=1.2.0",
    "pytest>=8.4.2",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
extend-exclude = [".agents", "_bmad", "_bmad-output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
project-includes = ["src", "tests", "apps/api"]
search-path = ["src", "apps/api"]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
